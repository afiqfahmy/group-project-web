<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Shopping Cart | TechStore</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header class="apple-header">
        <div class="header-inner">
            <a href="../main.html" class="back-link">← Back to Store</a>
            <a href="../index.html" class="logo">TechStore</a>
            <nav class="main-nav">
                <a href="../main.html">Store</a>
                <a href="../iphone/iphone.html">iPhone</a>
                <a href="../ipad/ipad.html">iPad</a>
                <a href="../mac/mac.html">Mac</a>
                <a href="../support.html">Support</a>
            </nav>

            <div class="cart">
                <a href="../cart.html" class="active">🛒 <span id="cart-count">0</span></a>
            </div>
        </div>
    </header>

    <main class="cart-container">
        <h1 class="fade-on-scroll">Your Bag</h1> <div id="cart-items" class="fade-on-scroll">
            </div>
        
        <div class="cart-summary fade-on-scroll">
            <div class="total" id="cart-total">Total: RM 0</div>
            <button class="checkout-btn" id="checkout-btn">Check Out</button>
        </div>

        <div id="custom-alert" class="custom-alert">
            <div class="alert-content">
                <span class="alert-message">Item removed.</span>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 TechStore. All rights reserved.</p>
    </footer>

    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
</body>
</html>

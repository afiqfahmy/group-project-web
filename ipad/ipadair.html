<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Buy iPad Air - TechStore</title>
    <link rel="stylesheet" href="../styles.css">
    <script src="../script.js" defer></script>

    <style>
        .selected-swatch {
            outline: 2px solid #0071e3;
            outline-offset: 3px;
        }

        .gallery-wrapper {
            width: 100%;
            max-width: 500px;
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
        }

        #main-product-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: opacity 0.3s ease;
        }

        .storage-card {
            border: 2px solid #d2d2d7;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: border-color 0.3s;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        .storage-card.selected-storage {
            border-color: #0071e3;
            background-color: rgba(0, 113, 227, 0.05);
        }

        .swatch-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 15px;
            cursor: pointer;
            border: 1px solid #ddd;
        }

        .gray-text {
            color: #6e6e73;
        }

        .purchase-container {
            display: flex;
            gap: 50px;
            padding: 50px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .options-sidebar {
            flex: 1;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 500;
            color: #0071e3;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body class="product-page">
        <header class="apple-header">
        <div class="header-inner">
            <a href="../iphone/iphone.html" class="back-link">← Back to iPhone</a>
            <a href="../index.html" class="logo">TechStore</a>
            <nav class="main-nav">
                <a href="../main.html">Store</a>
                <a href="iphone.html" class="active">iPhone</a>
                <a href="../ipad/ipad.html">iPad</a>
                <a href="../mac/mac.html">Mac</a>
                <a href="../support.html">Support</a>
            </nav>
            <div class="cart">
                <a href="../cart.html">🛒 <span id="cart-count">0</span></a>
            </div>
        </div>
    </header>

    <div class="sub-nav">
        <div class="sub-nav-content"
            style="display: flex; justify-content: space-between; padding: 15px 50px; border-bottom: 1px solid #d2d2d7;">
            <span class="product-name" style="font-weight: bold;">iPad Air</span>
            <span id="nav-price">From RM 2,799</span>
        </div>
    </div>

    <main class="purchase-container">

        <section class="gallery">
            <div class="gallery-wrapper">
                <img id="main-product-img" src="../image/ipad/ipadair.jpg" alt="iPad Air">
            </div>
        </section>

        <section class="options-sidebar">
            <h1 style="font-size: 40px; margin-bottom: 30px;">Buy iPad Air</h1>

            <div style="margin-bottom: 40px;">
                <h3>Finish. <span id="color-name" class="gray-text">Select a color</span></h3>
                <div style="margin-top: 15px;">
                    <div class="swatch-circle" style="background: #D1D1E0;"
                        data-image="../image/ipad/ipad-air-purple.webp" title="Purple"></div>

                    <div class="swatch-circle" style="background: #F0EAD6;"
                        data-image="../image/ipad/ipad-air-starlight.webp" title="Starlight"></div>

                    <div class="swatch-circle" style="background: #535355;"
                        data-image="../image/ipad/ipad-air-space-gray.webp" title="Space Gray"></div>

                    <div class="swatch-circle" style="background: #B9C8D6;"
                        data-image="../image/ipad/ipad-air-blue.webp" title="Blue"></div>
                </div>
            </div>

            <div>
                <h3>Storage. <span class="gray-text">How much space do you need?</span></h3>
                
                <div style="margin-top: 15px;">
                    <div class="storage-card" data-price="RM 2,799">
                        <div class="storage-size">128GB</div>
                        <div class="storage-price">RM 2,799</div>
                    </div>

                    <div class="storage-card" data-price="RM 3,199">
                        <div class="storage-size">256GB</div>
                        <div class="storage-price">RM 3,199</div>
                    </div>

                    <div class="storage-card" data-price="RM 4,099">
                        <div class="storage-size">512GB</div>
                        <div class="storage-price">RM 4,099</div>
                    </div>

                    <div class="storage-card" data-price="RM 4,999">
                        <div class="storage-size">1TB</div>
                        <div class="storage-price">RM 4,999</div>
                    </div>
                </div>

                <button class="add-to-cart-btn" data-name="iPad Air" data-price="2799"
                    data-img="../image/ipad/ipadair.jpg"
                    style="margin-top:30px;padding:15px 25px;font-size:16px;border-radius:12px;border:none;background:#0071e3;color:#fff;cursor:pointer;width:100%;font-weight:600;">
                    Add to Cart
                </button>
            </div>
        </section>
    </main>

        <footer>
            <p>© 2025 TechStore. All rights reserved.</p>
        </footer>

</body>

</html>

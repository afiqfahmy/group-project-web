<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Buy iPad Pro - TechStore</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        /* Essential CSS for functionality and sizing */
        .selected-swatch {
            outline: 2px solid #0071e3;
            outline-offset: 3px;
        }

        /* This fixes the size difference between your images */
        .gallery-wrapper {
            width: 100%;
            flex: 1.5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 50px;
        }

        #main-product-img {
            width: 100%;
            max-width: 650px;
            height: auto;
            object-fit: contain;
            transition: opacity 0.3s ease;
        }

        .storage-card {
            border: 2px solid #d2d2d7;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: border-color 0.3s;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between
        }

        .storage-card.selected-storage {
            border-color: #0071e3;
            background-color: rgba(0, 113, 227, 0.05);
        }

        .swatch-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 15px;
            cursor: pointer;
            border: 1px solid #ddd;
        }

        .gray-text {
            color: #6e6e73;
        }

        .purchase-container {
            display: flex;
            gap: 50px;
            padding: 50px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .options-sidebar {
            flex: 1;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;

            font-size: 14px;
            font-weight: 500;
            color: #0071e3;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>

</head>

<header class="apple-header"
    style="position: sticky; top: 0; background: #fff; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.05); padding: 15px 50px;">
    <div class="header-inner" style="display: flex; align-items: center; justify-content: space-between; gap: 20px;">

        <!-- Back to Store -->
        <a href="../main.html" class="back-link"
            style="font-size: 14px; font-weight: 500; color: #0071e3; text-decoration: none; margin-right: 20px;">
            ← Back to Store
        </a>

        <!-- Logo -->
        <a href="../index.html" class="logo"
            style="font-size: 24px; font-weight: bold; color: #1d1d1f; text-decoration: none;">
            TechStore
        </a>

        <!-- Navigation -->
        <nav class="main-nav" style="display: flex; gap: 25px; margin-left: auto;">
            <a href="../main.html" style="text-decoration: none; color: #1d1d1f; font-weight: 500;">Store</a>
            <a href="../iphone/iphone.html" style="text-decoration: none; color: #1d1d1f;font-weight: 500;">iPhone</a>
            <a href="../ipad/ipad.html" class="active"
                style="text-decoration: none; color: #0071e3; font-weight: 500;">iPad</a>
            <a href="../mac/mac.html" style="text-decoration: none; color: #1d1d1f; font-weight: 500;">Mac</a>
            <a href="../support.html" style="text-decoration: none; color: #1d1d1f; font-weight: 500;">Support</a>
        </nav>

        <!-- Cart -->
        <div class="cart" style="margin-left: 20px;">
            <a href="../cart.html" style="text-decoration: none; font-size: 18px; color: #1d1d1f;">🛒 <span
                    id="cart-count" style="font-weight: bold;">0</span></a>
        </div>

    </div>
</header>

<body class="product-page">

    <div class="sub-nav">
        <div class="sub-nav-content"
            style="display: flex; justify-content: space-between; padding: 15px 50px; border-bottom: 1 px solid #d2d2d7;">
            <span class="product-name">iPad Air</span>
            <div class="sub-nav-right">
                <span>From RM 2,799</span>
            </div>
        </div>
    </div>

    <main class="purchase-container">

        <section class="gallery">
            <div class="gallery-wrapper">
                <img id="main-product-img" src="../image/ipad/ipadair.jpg" alt="iPad Air">
            </div>
        </section>

        <section class="options-sidebar">
            <h1 class="buy-title" style="font-size: 40px; margin-bottom: 30px;">Buy iPad Air</h1>
            <div class="section-group" style="margin-bottom: 40px;">
                <h3>Finish. <span class="gray-text">Select a color</span></h3>
                <div class="swatch-row">
                    <div class="swatch-circle" style="background: #D1D1E0;"
                        data-image="../image/ipad/ipad-air-purple.webp" title="Purple"></div>

                    <div class="swatch-circle" style="background: #F0EAD6;"
                        data-image="../image/ipad/ipad-air-starlight.webp" title="Starlight"></div>

                    <div class="swatch-circle" style="background: #535355;"
                        data-image="../image/ipad/ipad-air-space-gray.webp" title="Space Gray"></div>

                    <div class="swatch-circle" style="background: #B9C8D6;"
                        data-image="../image/ipad/ipad-air-blue.webp" title="Blue"></div>
                </div>
            </div>

            <div class="section-group">
                <h3>Storage. <span class="gray-text">How much space do you need?</span></h3>
                <div class="storage-list">
                    <div class="storage-card">
                        <span class="size">128GB</span>
                        <span class="price-tag">From RM 2,799</span>
                    </div>
                    <div class="storage-card">
                        <span class="size">256GB</span>
                        <span class="price-tag">From RM 3,199</span>
                    </div>
                    <div class="storage-card">
                        <span class="size">512GB</span>
                        <span class="price-tag">From RM 4,099</span>
                    </div>
                    <div class="storage-card">
                        <span class="size">1TB</span>
                        <span class="price-tag">From RM 4,999</span>
                    </div>
                </div>
            </div>

            <a href="ipad.html" class="back-link">
                ← Back to iPad
            </a>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Color Logic
            const swatches = document.querySelectorAll('.swatch-circle');
            const mainImg = document.getElementById('main-product-img');
            const colorLabel = document.getElementById('color-name');

            swatches.forEach(swatch => {
                swatch.addEventListener('click', function () {
                    const newImg = this.getAttribute('data-image');
                    if (newImg) {
                        mainImg.style.opacity = '0'; // Quick fade out
                        setTimeout(() => {
                            mainImg.src = newImg;
                            mainImg.style.opacity = '1'; // Fade in
                        }, 150);
                    }
                    colorLabel.innerText = this.getAttribute('title');
                    swatches.forEach(s => s.classList.remove('selected-swatch'));
                    this.classList.add('selected-swatch');
                });
            });

            // Storage Logic
            const storageCards = document.querySelectorAll('.storage-card');
            const navPrice = document.getElementById('nav-price');

            storageCards.forEach(card => {
                card.addEventListener('click', function () {
                    navPrice.innerText = this.getAttribute('data-price');
                    storageCards.forEach(c => c.classList.remove('selected-storage'));
                    this.classList.add('selected-storage');
                });
            });
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Buy iPad Pro - TechStore</title>
    <link rel="stylesheet" href="../styles.css">

    <script>
        // Select the elements
        const swatches = document.querySelectorAll('.swatch-circle');
        const mainImg = document.querySelector('.gallery img');
        const colorLabel = document.getElementById('color-name'); // Ensure your <span> has this ID

        swatches.forEach(swatch => {
            swatch.addEventListener('click', function () {
                // 1. Update the Image
                const newImgPath = this.getAttribute('data-image');
                if (newImgPath) {
                    mainImg.src = newImgPath;
                }

                // 2. Update the Text (the title attribute)
                const newColorName = this.getAttribute('title');
                if (colorLabel) {
                    colorLabel.innerText = newColorName;
                }

                // 3. Update the Visual "Lock" (Blue Ring)
                swatches.forEach(s => s.classList.remove('selected-swatch'));
                this.classList.add('selected-swatch');
            });
        });
    </script>
</head>

<header class="apple-header">
    <div class="header-inner">
        <a href="index.html" class="logo">TechStore</a>

        <nav class="main-nav">
            <a href="../main.html">Store</a>
            <a href="../iphone/iphone.html">iPhone</a>
            <a href="../ipad/ipad.html" class="active">iPad</a>
            <a href="../mac/mac.html">Mac</a>
            <a href="../support.html">Support</a>
        </nav>
    </div>
</header>

<body class="product-page">

    <div class="sub-nav">
        <div class="sub-nav-content">
            <span class="product-name">iPad mini</span>
            <div class="sub-nav-right">
                <span>From RM 1,599</span>
            </div>
        </div>
    </div>

    <main class="purchase-container">

        <section class="gallery">
            <div class="gallery-wrapper">
                <img src="../image/ipad/ipadmini.png" alt="iPad mini">
            </div>
        </section>

        <section class="options-sidebar">
            <h1 class="buy-title">Buy iPad mini</h1>
            <div class="section-group">
                <h3>Finish. <span class="gray-text">Natural Titanium</span></h3>
                <div class="swatch-row">
                    <div class="swatch-circle" style="background: #535355;" data-image="../image/iphone/17pm-silver.png"
                        title="Space Gray"></div>

                    <div class="swatch-circle" style="background: #B9C8D6;" data-image="../image/iphone/17pm-gold.png"
                        title="Blue"></div>

                    <div class="swatch-circle" style="background: #B6B3C9;" data-image="../image/iphone/17pm-gold.png"
                        title="Purple"></div>

                    <div class="swatch-circle" style="background: #F0EAD6;" data-image="../image/iphone/17pm-gold.png"
                        title="Starlight"></div>
                </div>
            </div>

            <div class="section-group">
                <h3>Storage. <span class="gray-text">How much space do you need?</span></h3>
                <div class="storage-list">
                    <div class="storage-card">
                        <span class="size">128GB</span>
                        <span class="price-tag">From RM 2,199</span>
                    </div>
                    <div class="storage-card">
                        <span class="size">256GB</span>
                        <span class="price-tag">From RM 2,599</span>
                    </div>
                    <div class="storage-card">
                        <span class="size">512GB</span>
                        <span class="price-tag">From RM 3,499</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

</body>

</html>

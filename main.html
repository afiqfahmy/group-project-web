<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore | Store</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>

    <style>
        .main-nav {
            padding-left: 50%;
        }

        .logo {
            position: absolute;
            left: 0%;
            padding-left: 5%;
            transform: translateX(-0%);
        }
    </style>
</head>

<body>

    <header class="apple-header">
        <div class="header-inner">
            <a href="../index.html" class="logo">
                TechStore
            </a>

            <nav class="main-nav">
                <a href="main.html" class="active">Store</a>
                <a href="/iphone/iphone.html">iPhone</a>
                <a href="/ipad/ipad.html">iPad</a>
                <a href="/mac/mac.html">Mac</a>
                <a href="/support.html">Support</a>
            </nav>

            <div class="cart">
                <a href="../cart.html">🛒 <span id="cart-count">0</span></a>
            </div>
        </div>
    </header>

    <main class="categories-container">
        <div class="section-header">
            <h1 class="fade-on-scroll">Store. <span class="gray-text">The best way to buy the products you love.</span>
            </h1>
        </div>

        <section class="categories-grid">

            <a href="iphone/iphone.html" class="category-card fade-on-scroll">
                <div class="card-content">
                    <span class="card-subtitle">iPhone</span>
                    <h2 class="card-title">Experience the power of iOS.</h2>
                </div>
                <div class="card-image">
                    <img src="image/iphone.png" alt="iPhone">
                </div>
                <span class="shop-link">Shop iPhone &gt;</span>
            </a>

            <a href="ipad/ipad.html" class="category-card fade-on-scroll">
                <div class="card-content">
                    <span class="card-subtitle">iPad</span>
                    <h2 class="card-title">Work, create, and play anywhere.</h2>
                </div>
                <div class="card-image">
                    <img src="image/ipad.png" alt="iPad">
                </div>
                <span class="shop-link">Shop iPad &gt;</span>
            </a>

            <a href="mac/mac.html" class="category-card fade-on-scroll">
                <div class="card-content">
                    <span class="card-subtitle">Mac</span>
                    <h2 class="card-title">Performance meets elegance.</h2>
                </div>
                <div class="card-image">
                    <img src="image/mac-b.png" alt="MacBook">
                </div>
                <span class="shop-link">Shop Mac &gt;</span>
            </a>

        </section>
    </main>

    <footer>
        <p>© 2025 TechStore. All rights reserved.</p>
    </footer>

    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore | Store</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>

</head>

<body>

    <header class="apple-header"
        style="position: sticky; top: 0; background: #fff; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.05); padding: 15px 50px;">
        <div class="header-inner"
            style="display: flex; align-items: center; justify-content: space-between; gap: 20px;">

            <!-- Back to Store -->
            <a href="../main.html" class="back-link"
                style="font-size: 14px; font-weight: 500; color: #0071e3; text-decoration: none; margin-right: 20px;">
                ← Back to Store
            </a>

            <!-- Logo -->
            <a href="../index.html" class="logo"
                style="font-size: 24px; font-weight: bold; color: #1d1d1f; text-decoration: none;">
                TechStore
            </a>

            <!-- Navigation -->
            <nav class="main-nav" style="display: flex; gap: 25px; margin-left: auto;">
                <a href="main.html" class="active"
                    style="text-decoration: none; color: #0071e3; font-weight: 500;">Store</a>
                <a href="/iphone/iphone.html"
                    style="text-decoration: none; color: #1d1d1f; font-weight: 500;">iPhone</a>
                <a href="/ipad/ipad.html" style="text-decoration: none; color: #1d1d1f; font-weight: 500;">iPad</a>
                <a href="/mac/mac.html" style="text-decoration: none; color: #1d1d1f; font-weight: 500;">Mac</a>
                <a href="/support.html" style="text-decoration: none; color: #1d1d1f; font-weight: 500;">Support</a>
            </nav>

            <!-- Cart -->
            <div class="cart" style="margin-left: 20px;">
                <a href="../cart.html" style="text-decoration: none; font-size: 18px; color: #1d1d1f;">🛒 <span
                        id="cart-count" style="font-weight: bold;">0</span></a>
            </div>

        </div>
    </header>

    <!-- CATEGORIES -->
    <section class="categories fade-on-scroll">

        <a href="iphone/iphone.html" class="category-card fade-on-scroll">
            <img src="image/iphone.png" alt="iPhone">
            <h2>iPhone</h2>
            <p>Experience the power of iOS.</p>
            <span>Shop iPhone</span>
        </a>

        <a href="ipad/ipad.html" class="category-card fade-on-scroll">
            <img src="image/ipad.png" alt="iPad">
            <h2>iPad</h2>
            <p>Work, create, and play anywhere.</p>
            <span>Shop iPad</span>
        </a>

        <a href="mac/mac.html" class="category-card fade-on-scroll">
            <img src="image/mac-b.png" alt="MacBook" style="max-height: 100px; max-width: 100px;">
            <h2>Mac</h2>
            <p>Performance meets elegance.</p>
            <span>Shop Mac</span>
        </a>

    </section>


    <footer>
        <p>© 2025 TechStore. All rights reserved.</p>
    </footer>

</body>

</html>

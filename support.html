<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore | Support</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>


    <header class="apple-header"
        style="position: sticky; top: 0; background: #fff; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.05); padding: 15px 50px;">
        <div class="header-inner"
            style="display: flex; align-items: center; justify-content: space-between; gap: 20px;">

            <a href="../main.html" class="back-link"
                style="font-size: 14px; font-weight: 500; color: #0071e3; text-decoration: none; margin-right: 20px; margin-bottom: 0;">
                ← Back to Store
            </a>

            <a href="../index.html" class="logo"
                style="font-size: 24px; font-weight: bold; color: #1d1d1f; text-decoration: none;">
                TechStore
            </a>

            <nav class="main-nav" style="display: flex; gap: 25px; margin-left: auto;">
                <a href="../main.html" style="text-decoration: none; color: #1d1d1f; font-weight: 500;">Store</a>
                <a href="../iphone/iphone.html"
                    style="text-decoration: none; color: #1d1d1f; font-weight: 500;">iPhone</a>
                <a href="/ipad/ipad.html" style="text-decoration: none; color: #1d1d1f; font-weight: 500;">iPad</a>
                <a href="../mac/mac.html" style="text-decoration: none; color: #1d1d1f; font-weight: 500;">Mac</a>
                <a href="../support.html" class="active"
                    style="text-decoration: none; color: #0071e3; font-weight: 500;">Support</a>
            </nav>

            <div class="cart" style="margin-left: 20px;">
                <a href="../cart.html" style="text-decoration: none; font-size: 18px; color: #1d1d1f;">🛒 <span
                        id="cart-count" style="font-weight: bold;">0</span></a>
            </div>

        </div>
    </header>


    <!-- SUPPORT SECTION -->
    <section class="support">
        <h1>How can we help?</h1>
        <p>Fill in the form below and our support team will assist you.</p>

        <form id="supportForm" class="support-form">
            <input type="text" placeholder="Your name" required>
            <input type="email" placeholder="Email address" required>

            <select required>
                <option value="" disabled selected>Type of report</option>
                <option>Technical Issue</option>
                <option>Order Problem</option>
                <option>Payment Issue</option>
                <option>General Inquiry</option>
            </select>

            <button type="submit">Submit</button>
        </form>

        <p id="successMessage" class="success-message">
            Your report has been submitted.
        </p>
    </section>

    <script>
        const form = document.getElementById("supportForm");
        const message = document.getElementById("successMessage");

        form.addEventListener("submit", function (e) {
            e.preventDefault();

            form.style.display = "none";
            message.style.display = "block";

            setTimeout(() => {
                window.location.href = "main.html";
            }, 2000);
        });
    </script>

</body>

</html>
